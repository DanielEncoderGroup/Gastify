# docker-compose.yml
version: '3.8'

services:
  # ───────────────────────────────────────────────────────────────────────────────
  # 1) MongoDB (disabled - using host MongoDB instead)
  # ───────────────────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    container_name: gastify-mongo
    # Changed port to avoid conflict with host MongoDB
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gastify-network
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────────
  # 2) Backend (FastAPI)
  # ───────────────────────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gastify-server
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    environment:
      # variables para producción (se usan en server/app/core/config.py)
      - MONGO_URI=mongodb://mongo:27017/gastify
      - ENVIRONMENT=production
      - JWT_SECRET=your_jwt_secret_key
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080   # 7 días
      - SMTP_HOST=cpmail1.ghservers.net
      - SMTP_PORT=465
      - SMTP_USER=noreply@gastify.com
      - SMTP_PASSWORD=dd)c}{F]P]U#
      - SMTP_SSL=true
      - SMTP_VERIFY_SSL=false
      - CLIENT_URL=http://localhost             # para enlaces de verificación
      - ADMIN_EMAIL=admin@example.com
      - PYTHONUNBUFFERED=1
      # ======================================
      # CONFIGURACIÓN GOOGLE VISION API (OCR)
      # ======================================
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google-vision-credentials.json
      # Configuración OCR Híbrido
      - OCR_CACHE_ENABLED=true
      - OCR_CACHE_TTL=3600
      - OCR_CONFIDENCE_THRESHOLD=0.9
      - OCR_MAX_GOOGLE_REQUESTS_PER_MONTH=1000
      # Configuración Tesseract
      - TESSERACT_CMD_PATH=tesseract
      # Configuración avanzada
      - OCR_ENABLE_PREPROCESSING=true
      - OCR_LOG_PROCESSING_TIME=true
      - OCR_ENABLE_METRICS=true
    volumes:
      - ./server/app:/app/app
      - ./server/scripts:/app/scripts
      - ./server/uploads:/app/uploads
      # Montar archivo de credenciales de Google Vision API (archivo correcto encontrado)
      - ./rock-embassy-467919-s1-d4988ace62e6.json:/app/credentials/google-vision-credentials.json:ro
    networks:
      - gastify-network
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────────────────
  # 3) Frontend (React + nginx)
  # ───────────────────────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client-new
      dockerfile: Dockerfile
    container_name: gastify-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - gastify-network
    restart: unless-stopped

# Volúmenes persistentes
volumes:
  mongo-data:

# Red compartida
networks:
  gastify-network:
    driver: bridge
